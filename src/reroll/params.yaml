# Reroll parameters
#
# Every number here is an ASSUMPTION for entertainment purposes and is not based
# on any research. If a parameter ever gets a real basis, cite it in `source`.

# Range and per-commit max change for each stat
# (copied into life.json's state_schema on `life init`).
stats:
  energy: { min: 0, max: 100, max_delta: 15 }
  mood:   { min: 0, max: 100, max_delta: 15 }
  money:  { min: 0, max: 100, max_delta: 15 }   # financial health, not an amount
  social: { min: 0, max: 100, max_delta: 15 }
  goal:   { min: 0, max: 100, max_delta: 10 }

initial_state: { energy: 70, mood: 60, money: 50, social: 50, goal: 10 }

# Action table: the narrator may only pick an action from here. The numeric
# effect is rolled by code within [lo, hi].
# tags: history tags attached after taking the action; duration is in days.
actions:
  exercise:
    description: { en: "Work out, go to the gym, take a walk", zh: "运动、健身、散步" }
    effects: { energy: [-8, -3], mood: [2, 6], goal: [1, 3] }
    tags: [{ name: exercised, duration: 3 }]
    source: assumption
  overtime:
    description: { en: "Work overtime, extra work", zh: "加班、额外工作" }
    effects: { energy: [-12, -6], money: [3, 8], mood: [-5, -1] }
    tags: [{ name: overtime, duration: 2 }]
    source: assumption
  stay_up:
    description: { en: "Stay up late (scrolling, bingeing, gaming)", zh: "熬夜（刷手机、追剧、打游戏）" }
    effects: { energy: [-12, -5], mood: [1, 5] }
    tags: [{ name: late_night, duration: 3 }]
    source: assumption
  socialize:
    description: { en: "Hang out with friends, go out to eat", zh: "和朋友聚会、约饭" }
    effects: { social: [4, 10], mood: [2, 6], money: [-5, -1], energy: [-5, -1] }
    tags: [{ name: socialized, duration: 4 }]
    source: assumption
  save_money:
    description: { en: "Save money, cook at home, buy nothing", zh: "省钱、做饭、不买东西" }
    effects: { money: [2, 6], mood: [-3, 0] }
    tags: [{ name: frugal, duration: 3 }]
    source: assumption
  impulse_buy:
    description: { en: "Impulse purchase", zh: "冲动消费" }
    effects: { money: [-10, -3], mood: [3, 8] }
    tags: [{ name: impulse_spent, duration: 5 }]
    source: assumption
  study:
    description: { en: "Study, read, work on a side project", zh: "学习、读书、做自己的项目" }
    effects: { goal: [2, 6], energy: [-6, -2], mood: [-2, 3] }
    tags: [{ name: studied, duration: 3 }]
    source: assumption
  rest:
    description: { en: "Sleep early, rest, do nothing", zh: "早睡、休息、躺平" }
    effects: { energy: [5, 12], mood: [0, 4], goal: [-2, 0] }
    tags: [{ name: rested, duration: 2 }]
    source: assumption
  chores:
    description: { en: "Clean up, do laundry, run errands", zh: "做家务、打扫、跑腿办事" }
    effects: { energy: [-5, -2], mood: [-1, 3], goal: [0, 2] }
    tags: [{ name: tidied, duration: 3 }]
    source: assumption
  family:
    description: { en: "Time with family, call your parents", zh: "陪家人、给爸妈打电话" }
    effects: { social: [3, 7], mood: [1, 4], energy: [-3, 0] }
    tags: [{ name: family_time, duration: 4 }]
    source: assumption
  hobby:
    description: { en: "A hobby: draw, make music, craft, garden", zh: "兴趣爱好：画画、玩音乐、做手工、养花" }
    effects: { mood: [2, 5], goal: [0, 3], energy: [-3, 0], money: [-2, 0] }
    tags: [{ name: creative, duration: 3 }]
    source: assumption
  outing:
    description: { en: "Get out: a day trip, explore, a museum", zh: "出门走走：短途旅行、探店、看展" }
    effects: { mood: [2, 6], energy: [-8, -3], money: [-6, -1], social: [0, 4] }
    tags: [{ name: adventured, duration: 4 }]
    source: assumption

# Baseline change at the start of every day, before any choice: you sleep and recover some
# energy, while mood and social life slowly fade unless you do something about them.
# Without this, 6 of 8 actions drain energy and the simulation slides into exhaustion.
daily_drift: { energy: 3, mood: -2, social: -1 }   # source: assumption (tuned so a mixed week is roughly flat)

# Custom action type: when no type above fits, the player says which stats go up or down
# ("custom:energy-,mood+"), and these ranges decide by how much. No habit tag.
custom_action: { up: [2, 6], down: [-6, -2] }   # source: assumption (a moderate, everyday-sized effect)

# History tags: the butterfly effect. Every tag attached by an action must be listed here.
# carryover: stat change applied once per day while the tag is active, times its count
#            (so two late nights in a row hurt twice as much).
# habit:     multiplies how likely the simulation is to pick an action (habits stick).
tags:
  exercised:     { carryover: { mood: 1 },              habit: { exercise: 1.4 },                      source: assumption }
  overtime:      { carryover: { energy: -1, mood: -1 }, habit: { overtime: 1.3, socialize: 0.8 },      source: assumption }
  late_night:    { carryover: { energy: -3 },           habit: { stay_up: 1.6, exercise: 0.7 },        source: assumption }
  socialized:    { carryover: { mood: 1 },              habit: { socialize: 1.2 },                     source: assumption }
  frugal:        { carryover: {},                       habit: { save_money: 1.3, impulse_buy: 0.7 },  source: assumption }
  impulse_spent: { carryover: { money: -1 },            habit: { impulse_buy: 1.5 },                   source: assumption }
  studied:       { carryover: { goal: 1 },              habit: { study: 1.3 },                         source: assumption }
  rested:        { carryover: { energy: 1 },            habit: { rest: 1.1 },                          source: assumption }
  tidied:        { carryover: {},                       habit: { chores: 1.1 },                        source: assumption }
  family_time:   { carryover: { mood: 1 },              habit: { family: 1.2 },                        source: assumption }
  creative:      { carryover: { mood: 1 },              habit: { hobby: 1.3 },                         source: assumption }
  adventured:    { carryover: {},                       habit: { outing: 0.8, rest: 1.2 },             source: assumption }

# Monte Carlo forecast ("the superposition"): simulate `runs` futures for `horizon` days.
# Each simulated day picks an action with weight
#   (base_weight + history_weight * times you chose it on this branch) * tag habits * low-stat rules
simulation:
  runs: 200
  horizon: 7
  base_weight: 1.0
  history_weight: 0.5
  # Risk rating = chance that any of energy/mood/money/social drops below `danger_below`
  # at some point within the horizon.
  danger_below: 20
  risk_prob: { medium: 0.15, high: 0.4 }
  # When a stat is low, behavior shifts (tired people rest, broke people save).
  low_stat_rules:
    - { stat: energy, below: 30, habit: { rest: 2.5, exercise: 0.5, overtime: 0.5, stay_up: 0.7 }, source: assumption }
    - { stat: money,  below: 30, habit: { save_money: 2.0, impulse_buy: 0.4, overtime: 1.5 },     source: assumption }
    - { stat: social, below: 30, habit: { socialize: 2.0 },                                       source: assumption }
    - { stat: mood,   below: 30, habit: { socialize: 1.5, rest: 1.5, impulse_buy: 1.5, hobby: 1.5, family: 1.3 }, source: assumption }
